<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GamersHub</title>
  <meta name="description" content="GamersHub: discover gaming sites, or get yours seen.">
  <style>
    :root { --bg:#07050f; --card:#120b2a; --text:#ecebf5; --muted:#a6a3bd; --a:#a855f7; --b:#22d3ee; }
    * { box-sizing: border-box; }
    body { margin:0; font:16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color:var(--text);
           background: radial-gradient(900px 500px at 0% 0%, rgba(168,85,247,.28), transparent 60%),
                       radial-gradient(800px 500px at 100% 100%, rgba(34,211,238,.18), transparent 60%), var(--bg); min-height:100vh; }
    main { max-width: 720px; margin: 0 auto; padding: 72px 24px; }
    h1 { font-size: clamp(2.2rem, 6vw, 3.4rem); margin:0 0 12px; letter-spacing:.02em;
         background: linear-gradient(90deg, var(--a), var(--b)); -webkit-background-clip:text; background-clip:text; color:transparent; }
    p { color: var(--muted); }
    nav { display:flex; gap:12px; flex-wrap:wrap; margin-top:32px; }
    a.btn { color:#fff; text-decoration:none; padding:10px 18px; border-radius:999px; border:1px solid rgba(255,255,255,.18);
            background: rgba(255,255,255,.06); }
    a.btn:hover { border-color: var(--b); }
  </style>
</head>
<body>
  <main>
    <h1>GamersHub</h1>
    <p>Discover great gaming sites, or get yours seen. Browse by category, read reviews, and jump straight to the games.</p>
    <nav>
      <a class="btn" href="support.html">Support</a>
      <a class="btn" href="privacy.html">Privacy policy</a>
    </nav>
  </main>
</body>
</html>
