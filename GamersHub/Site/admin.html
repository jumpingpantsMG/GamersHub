<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; connect-src https://qyfzhgqrvkbviipfglsk.supabase.co; base-uri 'none'; form-action 'none'">
  <title>GamersHub Admin</title>
  <style>
    :root { --bg:#07050f; --card:#120b2a; --line:rgba(255,255,255,.12); --text:#ecebf5; --muted:#a6a3bd;
            --a:#a855f7; --b:#22d3ee; --red:#f87171; --green:#4ade80; }
    * { box-sizing: border-box; }
    body { margin:0; font:15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
    header { display:flex; align-items:center; gap:16px; padding:14px 20px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
    h1 { margin:0; font-size:1.1rem; background:linear-gradient(90deg,var(--a),var(--b)); -webkit-background-clip:text; background-clip:text; color:transparent; }
    main { max-width:960px; margin:0 auto; padding:20px; }
    .tabs { display:flex; gap:8px; }
    button { font:inherit; color:var(--text); background:rgba(255,255,255,.07); border:1px solid var(--line); border-radius:999px; padding:6px 14px; cursor:pointer; }
    button:hover { border-color:var(--b); }
    button.active { background:var(--a); border-color:var(--a); }
    button.danger { border-color:var(--red); color:var(--red); }
    button.ok { border-color:var(--green); color:var(--green); }
    .spacer { flex:1; }
    input { font:inherit; color:var(--text); background:#0c0820; border:1px solid var(--line); border-radius:10px; padding:8px 12px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:12px; }
    .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .muted { color:var(--muted); font-size:.9rem; }
    .tag { font-size:.75rem; padding:2px 8px; border-radius:999px; border:1px solid var(--line); color:var(--muted); }
    .tag.red { color:var(--red); border-color:var(--red); }
    .tag.green { color:var(--green); border-color:var(--green); }
    .quote { border-left:3px solid var(--a); padding-left:10px; margin:8px 0; white-space:pre-wrap; overflow-wrap:anywhere; }
    .err { color:var(--red); margin:8px 0; }
    .login { max-width:340px; margin:80px auto; display:grid; gap:10px; }
    .hidden { display:none; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="admin.js"></script>
</body>
</html>
